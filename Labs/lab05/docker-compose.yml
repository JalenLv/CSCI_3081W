services:
  db:
    image: postgres:16-alpine
    container_name: lab05-postgres
    environment:
      POSTGRES_DB: lab05
      POSTGRES_USER: lab05
      POSTGRES_PASSWORD: lab05
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab05 -d lab05"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: lab05-fastapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lab05:lab05@db:5432/lab05
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lab05
      DB_USER: lab05
      DB_PASSWORD: lab05
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: |
      sh -c "
      pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:
